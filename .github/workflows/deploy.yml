# every push to main goes to staging; production is deployed by hand: Actions → deploy →
# Run workflow, environment "production", optionally the commit already tested on staging.
# The image is built here (PUBLIC_URL is compiled in, so one image per environment), pushed to
# ghcr.io and started on the server by scripts/deploy.sh over SSH through Tailscale. See "deploying" in README.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [production, staging]
        default: production
      ref:
        description: Commit to deploy (empty = the head of main)
        required: false
        default: ''

# read-only by default: only the deploy job, which pushes the image, may write packages. The check
# job installs and runs third-party code (bun install, svelte-check, eslint)
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  # never stop a deploy halfway, the next one waits instead
  cancel-in-progress: false

env:
  TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          # the token isn't left in .git/config for the steps that run dependencies' code
          persist-credentials: false
      - id: commit
        name: Resolve the commit
        run: |
          sha=$(git rev-parse HEAD)
          # only what is on main reaches the servers
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # a hung step otherwise holds the deploy concurrency group for hours (the default is 6)
    timeout-minutes: 30
    permissions:
      contents: read
      # pushes the image to ghcr.io
      packages: write
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          # docker/login-action gets the token itself, git needs none after the checkout
          persist-credentials: false
      - name: Image name
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$PUBLIC_URL" \
            || { echo "::error::set the PUBLIC_URL variable of the $TARGET environment"; exit 1; }
          # registry names must be lowercase
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TARGET-$SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # the post-run step that uploads the build record and writes the job summary hung once,
          # keeping the run alive after it had already failed: neither is needed here
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            PUBLIC_URL=${{ vars.PUBLIC_URL }}
            VERSION=${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.TARGET }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET }}
      # the server's SSH isn't on the internet: the job joins the tailnet as an ephemeral node
      # tagged tag:ci, which the tailnet policy only lets reach the server's port 22
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # keep the runner's own DNS: with the tailnet's (MagicDNS forwarding to its nameservers,
          # which tag:ci may not reach) the runner can't resolve github.com once connected, and
          # the post-run steps and the final log upload hang. The server is reached by IP anyway
          args: --accept-dns=false
      - name: Deploy on the server
        # the server waits up to 3 minutes for the new version, the rest is the image pull
        timeout-minutes: 15
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key's forced command on the server is scripts/deploy.sh, which gets these words
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes \
            "${SSH_USER:-deploy}@$SSH_HOST" "$TARGET $SHA"
