# builds a release .apk of the mobile app for sideloading. Run it by hand (Actions → mobile-android →
# Run workflow) or push a mobile-v* tag, which also attaches the .apk to that tag's GitHub release.
# Signed with the ANDROID_KEYSTORE_* secrets when they are set, else with the debug keystore.
# See "mobile app builds" in README.md.
name: mobile-android

on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token isn't left in .git/config for the steps that run dependencies' code
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # react native recommends jdk 17
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # caches gradle's downloads and build cache; setup-java's own cache needs the gradle files,
      # which only exist after prebuild
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --clean
      # the keystore only ever exists in the runner's temp dir; plugins/android-release-signing.js
      # reads it through the SGC_RELEASE_* gradle properties
      - name: Decode the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ORG_GRADLE_PROJECT_SGC_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: mobile/android
        env:
          # 64-bit arm only: every phone of the last years. Each extra cpu type compiles the native
          # code again (~5 min each) and adds ~25 MB that a sideloaded apk keeps on the phone
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          ORG_GRADLE_PROJECT_SGC_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_SGC_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SGC_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Signing certificate
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p build
          mv android/app/build/outputs/apk/release/app-release.apk build/SocialGiorgiovolaCasa.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs build/SocialGiorgiovolaCasa.apk | tee certs.txt
          sha=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1 \
            | tr a-f A-F | sed 's/../&:/g; s/:$//')
          [ -n "$sha" ] || { echo '::error::no signing certificate found'; exit 1; }
          {
            if [ -n "$ORG_GRADLE_PROJECT_SGC_RELEASE_STORE_FILE" ]; then
              echo 'Signed with the release keystore (`ANDROID_KEYSTORE_*` secrets).'
            else
              echo '**Signed with the debug keystore**: the `ANDROID_KEYSTORE_*` secrets are not set.'
              echo 'Fine for testing, but anyone can sign an update with it, and switching keystores later'
              echo 'means uninstalling the app first.'
            fi
            echo
            echo 'Signing certificate SHA-256, for the server'"'"'s `ANDROID_APP_FINGERPRINTS` (passkeys):'
            echo
            echo '```'
            echo "$sha"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SocialGiorgiovolaCasa-android
          path: mobile/build/SocialGiorgiovolaCasa.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only this job, which runs no third-party code, may write the release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SocialGiorgiovolaCasa-android
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # mobile-ios attaches to the same release, whichever runs first creates it
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes '' \
            || gh release view "$TAG" > /dev/null
          gh release upload "$TAG" SocialGiorgiovolaCasa.apk --clobber
