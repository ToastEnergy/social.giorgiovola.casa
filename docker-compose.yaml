services:
  web:
    build:
      context: .
      args:
        # compiled in as the CSRF origin: rebuild (up -d --build) after changing PUBLIC_URL
        PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-7777}}
    restart: unless-stopped
    ports:
      # only reachable from this machine by default: put a reverse proxy in front.
      # Set BIND_ADDRESS=0.0.0.0 if your proxy runs on another host.
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-7777}:${PORT:-7777}'
    environment:
      PORT: ${PORT:-7777}
      BODY_SIZE_LIMIT: 54525952
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${PORT:-7777}}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SIGNUP_PASSWORD: ${SIGNUP_PASSWORD:-}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      # optional bucket for avatars and images (README: storing assets in S3 / R2)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - avatars:/app/static/avatars
      - uploads:/app/static/uploads
      # message images, served only to their conversation (kept outside static/)
      - dm-uploads:/app/data/dm
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  avatars:
  uploads:
  dm-uploads:
