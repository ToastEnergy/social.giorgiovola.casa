# every push to main goes to staging; production is deployed by hand: Actions → deploy →
# Run workflow, environment "production", optionally the commit already tested on staging.
# The image is built here (PUBLIC_URL is compiled in, so one image per environment), pushed to
# ghcr.io and started on the server by scripts/deploy.sh over SSH. See "deploying" in README.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [production, staging]
        default: production
      ref:
        description: Commit to deploy (empty = the head of main)
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  # never stop a deploy halfway, the next one waits instead
  cancel-in-progress: false

env:
  TARGET: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - id: commit
        name: Resolve the commit
        run: |
          sha=$(git rev-parse HEAD)
          # only what is on main reaches the servers
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$sha is not on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Image name
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$PUBLIC_URL" \
            || { echo "::error::set the PUBLIC_URL variable of the $TARGET environment"; exit 1; }
          # registry names must be lowercase
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$TARGET-$SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            PUBLIC_URL=${{ vars.PUBLIC_URL }}
            VERSION=${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.TARGET }}
          cache-to: type=gha,mode=max,scope=${{ env.TARGET }}
      - name: Deploy on the server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key's forced command on the server is scripts/deploy.sh, which gets these words
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o BatchMode=yes \
            "${SSH_USER:-deploy}@$SSH_HOST" "$TARGET $SHA"
